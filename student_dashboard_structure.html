<html>
  <head>
    <title>student.dashboard</title>
    <link rel="stylesheet" href="student_dashboard_style.css" />
  </head>

  <body>
    <!-- Top Section-->
    <div class="top-section">
      <div class="clock">
        <p>00:00:00</p>
      </div>
      <div class="greeting">
        <p>Hello, user!</p>
      </div>
    </div>

    <!-- Todo Section-->
    <div class="todo">
      <input type="text" placeholder="Add task: " />
      <button>Add</button>

      <ul>
        <li>Example</li>
      </ul>
    </div>

    <!-- Quote Section -->
    <div class="quote">
      <p><q>One day you'd wish you started today</q></p>
    </div>
  </body>
</html>
